<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4F46E5">
<title>You're invited · PlanQuik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F7FB;
    --surface: #FFFFFF;
    --text: #111827;
    --muted: #6B7280;
    --line: #E5E7EB;
    --brand: #4F46E5;
    --brand-ink: #FFFFFF;
    --accent: #4F46E5;
    --ok: #16A34A;
    --no: #DC2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1115;
      --surface: #1A1D24;
      --text: #F3F4F6;
      --muted: #9CA3AF;
      --line: #2B303B;
      --brand: #818CF8;
      --brand-ink: #1E1B4B;
      --ok: #4ADE80;
      --no: #F87171;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 20px 16px 40px;
  }
  .wrap { width: 100%; max-width: 440px; }

  .brand { display: flex; align-items: center; gap: 10px; margin: 4px 4px 16px; font-weight: 700; font-size: 18px; letter-spacing: -0.3px; }
  .brand svg { width: 34px; height: 34px; display: block; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 28px; overflow: hidden; }
  .hidden { display: none !important; }

  /* Hero */
  .hero {
    padding: 22px 22px 26px;
    color: #fff;
    background: var(--accent);
    background: color-mix(in srgb, var(--accent) 80%, #000);
    position: relative;
  }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .pill { display: inline-block; padding: 4px 12px; border-radius: 20px; background: rgba(255,255,255,.2); font-size: 12px; font-weight: 600; }
  .tile { flex: none; width: 58px; border-radius: 16px; background: #fff; text-align: center; padding: 8px 0 7px; box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .tile .day { display: block; font-size: 24px; font-weight: 700; line-height: 1; color: var(--accent); }
  .tile .mon { display: block; font-size: 12px; font-weight: 600; margin-top: 3px; color: #374151; }
  .hero h1 { margin: 16px 0 4px; font-size: 28px; line-height: 1.2; letter-spacing: -0.5px; overflow-wrap: anywhere; }
  .hero .host { margin: 0; opacity: .85; font-size: 14px; }

  /* Details */
  .body { padding: 20px 22px 24px; }
  .row { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
  .row svg { flex: none; width: 20px; height: 20px; margin-top: 2px; color: var(--muted); }
  .row span { overflow-wrap: anywhere; }
  .desc { margin: 4px 0 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; white-space: pre-line; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }

  /* Reply */
  .hi { margin: 0 0 14px; font-size: 18px; font-weight: 600; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .btn { border-radius: 16px; padding: 14px 12px; font-weight: 600; font-size: 15px; border: 1.5px solid var(--line); background: transparent; color: var(--text); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .btn.decline { color: var(--no); border-color: var(--no); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .6; cursor: default; }
  .link { background: none; border: 0; color: var(--brand); font-weight: 600; padding: 8px 0; }

  .panel h2 { margin: 0 0 14px; font-size: 18px; }
  .field-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .stepper { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .stepper button { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--text); font-size: 22px; line-height: 1; }
  .stepper output { min-width: 28px; text-align: center; font-size: 22px; font-weight: 700; }
  textarea { width: 100%; font: inherit; color: var(--text); background: transparent; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; resize: vertical; min-height: 84px; }
  textarea:focus { outline: 3px solid var(--brand); outline-offset: 1px; }
  .panel .actions { margin-top: 16px; }
  .err { color: var(--no); font-size: 14px; margin: 12px 0 0; }

  /* Done */
  .done { text-align: center; padding: 6px 0 2px; }
  .badge { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .badge.no { background: color-mix(in srgb, var(--no) 16%, transparent); color: var(--no); }
  .badge svg { width: 32px; height: 32px; }
  .done h2 { margin: 0 0 4px; font-size: 22px; }
  .done p { margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }

  /* Loading / error */
  .state { padding: 44px 24px; text-align: center; }
  .state h2 { margin: 0 0 8px; font-size: 20px; }
  .state p { margin: 0; color: var(--muted); font-size: 14px; }
  .spinner { width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }

  .foot { margin: 18px 0 0; text-align: center; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main class="wrap">

  <div class="brand">
    <svg viewBox="18 18 72 72" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#3730A3"/></linearGradient></defs>
      <rect x="18" y="18" width="72" height="72" rx="16" fill="url(#g)"/>
      <path d="M40,37 H68 A8,8 0 0 1 76,45 V73 A8,8 0 0 1 68,81 H40 A8,8 0 0 1 32,73 V45 A8,8 0 0 1 40,37 Z" fill="#1E1B4B" fill-opacity=".22"/>
      <path d="M40,35 H68 A8,8 0 0 1 76,43 V71 A8,8 0 0 1 68,79 H40 A8,8 0 0 1 32,71 V43 A8,8 0 0 1 40,35 Z" fill="#fff"/>
      <path d="M40,35 H68 A8,8 0 0 1 76,43 V46 H32 V43 A8,8 0 0 1 40,35 Z" fill="#C7D2FE"/>
      <path d="M44,29 L44,40 M64,29 L64,40" stroke="#3730A3" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M58,50 L46,65 L53,65 L50,76 L62,60 L55,60 Z" fill="#F59E0B" stroke="#F59E0B" stroke-width="1.6" stroke-linejoin="round"/>
    </svg>
    <span>PlanQuik</span>
  </div>

  <section class="card" aria-live="polite">

    <!-- Loading -->
    <div id="loading" class="state">
      <div class="spinner" role="status" aria-label="Loading"></div>
      <p>Loading your invitation…</p>
    </div>

    <!-- Error / not found -->
    <div id="error" class="state hidden">
      <h2 id="errorTitle">Invitation not found</h2>
      <p id="errorText">This link may be incomplete, or the host may have cancelled the invitation.</p>
      <button id="retry" class="btn primary hidden" style="margin-top:18px">Try again</button>
    </div>

    <!-- Invitation -->
    <div id="invite" class="hidden">
      <div class="hero">
        <div class="hero-top">
          <span id="category" class="pill">Event</span>
          <div id="tile" class="tile hidden"><span id="tileDay" class="day"></span><span id="tileMon" class="mon"></span></div>
        </div>
        <h1 id="title"></h1>
        <p id="host" class="host"></p>
      </div>

      <div class="body">
        <div class="row">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M19,4h-1V2h-2v2H8V2H6v2H5C3.9,4 3,4.9 3,6v14c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2V6C21,4.9 20.1,4 19,4z M19,20H5V10h14V20z"/></svg>
          <span id="when"></span>
        </div>
        <div class="row" id="whereRow">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12,2C8.13,2 5,5.13 5,9c0,5.25 7,13 7,13s7,-7.75 7,-13c0,-3.87 -3.13,-7 -7,-7zM12,11.5c-1.38,0 -2.5,-1.12 -2.5,-2.5s1.12,-2.5 2.5,-2.5 2.5,1.12 2.5,2.5 -1.12,2.5 -2.5,2.5z"/></svg>
          <span id="where"></span>
        </div>
        <p id="desc" class="desc hidden"></p>

        <hr>

        <!-- Step 1: ask -->
        <div id="ask">
          <p id="hi" class="hi"></p>
          <div class="actions">
            <button id="btnAccept" class="btn primary">Accept</button>
            <button id="btnDecline" class="btn decline">Decline</button>
          </div>
        </div>

        <!-- Step 2: confirm -->
        <div id="panel" class="panel hidden">
          <h2 id="panelTitle"></h2>
          <div id="partyBlock">
            <span class="field-label" id="partyLabel">People coming, including you</span>
            <div class="stepper" role="group" aria-labelledby="partyLabel">
              <button id="minus" type="button" aria-label="One fewer person">−</button>
              <output id="party" aria-live="polite">1</output>
              <button id="plus" type="button" aria-label="One more person">+</button>
            </div>
          </div>
          <label class="field-label" for="note">Message for the host (optional)</label>
          <textarea id="note" maxlength="200" placeholder="Anything the host should know?"></textarea>
          <p id="sendError" class="err hidden"></p>
          <div class="actions">
            <button id="btnBack" class="btn" type="button">Back</button>
            <button id="btnConfirm" class="btn primary" type="button">Confirm</button>
          </div>
        </div>

        <!-- Step 3: done -->
        <div id="done" class="hidden">
          <div class="done">
            <div id="badge" class="badge" aria-hidden="true"></div>
            <h2 id="doneTitle"></h2>
            <p id="doneText"></p>
            <button id="btnChange" class="link" type="button" style="margin-top:12px">Change my reply</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <p class="foot">Sent with PlanQuik</p>
</main>

<script>
(() => {
  'use strict';

  const DB = 'https://eventplanner-1758f-default-rtdb.asia-southeast1.firebasedatabase.app';
  const COLORS = { Birthday: '#EC4899', Wedding: '#F59E0B', Meeting: '#3B82F6', Party: '#8B5CF6', Conference: '#10B981', Other: '#6B7280' };
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('t') || '';
  const tokenOk = /^[A-Za-z0-9_-]{16,64}$/.test(token);

  let invite = null;
  let choice = null;      // 'Accepted' | 'Declined'
  let party = 1;

  function show(name) {
    ['loading', 'error', 'invite'].forEach((id) => $(id).classList.toggle('hidden', id !== name));
  }

  function showError(title, text, canRetry) {
    $('errorTitle').textContent = title;
    $('errorText').textContent = text;
    $('retry').classList.toggle('hidden', !canRetry);
    show('error');
  }

  function step(name) {
    ['ask', 'panel', 'done'].forEach((id) => $(id).classList.toggle('hidden', id !== name));
  }

  async function load() {
    if (!tokenOk) {
      showError('Invitation not found', 'This link looks incomplete. Please open the full link from your invitation.', false);
      return;
    }
    show('loading');
    try {
      const res = await fetch(DB + '/invites/' + token + '.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (!data || !data.eventTitle) {
        showError('Invitation not found', 'This invitation may have been cancelled by the host, or the link is incorrect.', false);
        return;
      }
      render(data);
    } catch (e) {
      showError('Could not load the invitation', 'Please check your internet connection and try again.', true);
    }
  }

  function render(inv) {
    invite = inv;
    const color = COLORS[inv.eventCategory] || COLORS.Other;
    document.documentElement.style.setProperty('--accent', color);

    $('category').textContent = inv.eventCategory || 'Event';
    $('title').textContent = inv.eventTitle;
    $('host').textContent = inv.hostName ? 'Hosted by ' + inv.hostName : '';
    document.title = inv.eventTitle + ' · You\'re invited';

    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(inv.date || '');
    $('tile').classList.toggle('hidden', !m);
    if (m) {
      $('tileDay').textContent = String(parseInt(m[3], 10));
      $('tileMon').textContent = MONTHS[parseInt(m[2], 10) - 1] || '';
    }

    $('when').textContent = inv.whenText || ((inv.date || '') + ' ' + (inv.time || '')).trim();
    $('whereRow').classList.toggle('hidden', !inv.location);
    $('where').textContent = inv.location || '';
    $('desc').classList.toggle('hidden', !inv.description);
    $('desc').textContent = inv.description || '';
    $('hi').textContent = inv.guestName ? 'Hi ' + inv.guestName + ', can you make it?' : 'Can you make it?';

    renderReplyState();
    show('invite');
  }

  function renderReplyState() {
    const r = invite.reply || {};
    if (r.status === 'Accepted' || r.status === 'Declined') {
      const yes = r.status === 'Accepted';
      const size = Number(r.partySize) > 1 ? ', ' + Number(r.partySize) + ' people in total' : '';
      $('badge').className = 'badge' + (yes ? '' : ' no');
      $('badge').innerHTML = yes ? CHECK : CROSS;
      $('doneTitle').textContent = yes ? "You're going!" : 'Reply sent';
      $('doneText').textContent = yes
        ? 'The host knows you are coming' + size + '.'
        : 'The host has been told you can\'t make it.';
      step('done');
    } else {
      step('ask');
    }
  }

  function openPanel(status) {
    choice = status;
    const yes = status === 'Accepted';
    $('panelTitle').textContent = yes ? 'Great, you\'re coming!' : 'Sorry you can\'t make it';
    $('partyBlock').classList.toggle('hidden', !yes);
    party = 1;
    $('party').textContent = party;
    $('note').value = '';
    $('sendError').classList.add('hidden');
    $('btnConfirm').disabled = false;
    $('btnConfirm').textContent = yes ? 'Confirm' : 'Send reply';
    step('panel');
  }

  async function submit() {
    const btn = $('btnConfirm');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    $('sendError').classList.add('hidden');

    const body = {
      status: choice,
      partySize: choice === 'Accepted' ? party : 1,
      note: $('note').value.trim().slice(0, 200),
      respondedAt: { '.sv': 'timestamp' }
    };

    try {
      const res = await fetch(DB + '/invites/' + token + '/reply.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      invite.reply = { status: body.status, partySize: body.partySize, note: body.note };
      renderReplyState();
    } catch (e) {
      $('sendError').textContent = 'Could not send your reply. Check your connection and try again.';
      $('sendError').classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = choice === 'Accepted' ? 'Confirm' : 'Send reply';
    }
  }

  $('btnAccept').addEventListener('click', () => openPanel('Accepted'));
  $('btnDecline').addEventListener('click', () => openPanel('Declined'));
  $('btnBack').addEventListener('click', () => renderReplyState());
  $('btnConfirm').addEventListener('click', submit);
  $('btnChange').addEventListener('click', () => step('ask'));
  $('retry').addEventListener('click', load);
  $('minus').addEventListener('click', () => { party = Math.max(1, party - 1); $('party').textContent = party; });
  $('plus').addEventListener('click', () => { party = Math.min(20, party + 1); $('party').textContent = party; });

  load();
})();
</script>
</body>
</html>
